[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proactive-coding-orchestrator"
version = "0.3.0.dev1"
description = "An approval-first, event-driven control plane for coding agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Project contributors"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = []

[project.scripts]
pco = "proactive_coding_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proactive_coding_orchestrator = ["web/*.html", "web/*.css", "web/*.js", "web/*.png"]
