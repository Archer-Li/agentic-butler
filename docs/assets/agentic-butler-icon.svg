    <path d="m136 117 11 7" fill="none" stroke="#fffaf0" stroke-width="1.9" stroke-linecap="round"/>
    <path d="m128 135 30 9-6 15-29-10Z" fill="#fffaf0"/>
    <path d="m124 147 30 11-12 29c-5 10-16 14-29 11l-32-8 8-17 23 2Z" fill="#08090a"/>
    <path d="m89 174 22 2 13-28m31 11-11 26c-4 9-12 15-22 15"
