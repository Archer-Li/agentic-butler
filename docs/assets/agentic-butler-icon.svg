<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-labelledby="title">
  <title id="title">Agentic Butler, a red bow tie and a gloved hand holding three fanned terminals</title>
  <defs>
    <clipPath id="butler-emblem-crop"><circle cx="100" cy="100" r="98"/></clipPath>
  </defs>
  <g clip-path="url(#butler-emblem-crop)">
    <rect width="200" height="200" fill="#fffaf0"/>
    <g transform="translate(-13 -13)">
      <!-- The circle crops the figure at the collar. -->
      <path d="M0 216l10-101c3-23 15-36 37-45l15-7 8-29V0h30l1 37 12 27 16 9c14 8 21 22 22 43l6 100Z" fill="#08090a"/>
      <path d="M60 63l14-19 16 8 16-9 9 18-16 126Z" fill="#fffaf0"/>
