      <rect x="82" y="68" width="13" height="14" rx="3.6" fill="#ed2546" stroke="#08090a" stroke-width="2.8"/>
    </g>
    <!-- Three overlapping terminal windows, fanned like a hand of cards. -->
    <g fill="#08090a" stroke="#fffaf0" stroke-width="3.4" stroke-linejoin="round">
      <g transform="rotate(-21 146 122)">
        <rect x="124" y="56" width="43" height="64" rx="6"/>
        <path d="M124 66h43" stroke-width="2.6"/>
        <circle cx="131" cy="61" r="1.6" fill="#fffaf0" stroke="none"/>
      </g>
      <g transform="rotate(19 146 122)">
        <rect x="124" y="56" width="43" height="64" rx="6"/>
        <path d="M124 66h43" stroke-width="2.6"/>
        <circle cx="131" cy="61" r="1.6" fill="#fffaf0" stroke="none"/>
      </g>
      <rect x="124" y="51" width="46" height="68" rx="6"/>
      <path d="M124 62h46" stroke-width="2.6"/>
    </g>
    <circle cx="131" cy="57" r="1.5" fill="#fffaf0"/>
    <circle cx="136" cy="57" r="1.5" fill="#fffaf0"/>
    <path d="m133 76 7 6-7 6m14 0h10" fill="none" stroke="#fffaf0" stroke-width="4"
