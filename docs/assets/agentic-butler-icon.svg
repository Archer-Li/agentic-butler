      <path d="M63 59q-3-2-3 2v27q0 4 3 2l23-11V70Zm51 0q3-2 3 2v27q0 4-3 2L92 79V70Z" fill="#ed2546"/>
      <path d="m68 66 14 8-14 7m41-15-14 8 14 7"
